<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Crédito e Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-8">
    <!-- Header -->
    <div class="bg-white shadow-xl rounded-2xl p-6">
      <h1 class="text-3xl font-bold text-gray-800">Sistema de Crédito e Pedidos</h1>
      <p class="text-gray-500">Gerencie clientes, produtos, créditos e pedidos com GitHub</p>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-4 right-4 hidden bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-opacity duration-300"></div>

    <!-- Seção Clientes -->
    <div class="bg-white shadow-xl rounded-2xl p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4"><i data-lucide="users" class="inline-block w-5 h-5 mr-2"></i>Clientes</h2>
      <div class="flex gap-2 mb-4">
        <input id="clientNameInput" type="text" placeholder="Nome do cliente" class="flex-1 p-2 border rounded-lg" />
        <button onclick="addClient()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>Adicionar</button>
      </div>
      <ul id="clientList" class="space-y-2"></ul>
    </div>

    <!-- Seção Produtos -->
    <div class="bg-white shadow-xl rounded-2xl p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4"><i data-lucide="package" class="inline-block w-5 h-5 mr-2"></i>Produtos</h2>
      <div class="flex gap-2 mb-4">
        <input id="productNameInput" type="text" placeholder="Nome do produto" class="flex-1 p-2 border rounded-lg" />
        <input id="productPriceInput" type="number" placeholder="Preço" min="0" step="0.01" class="w-24 p-2 border rounded-lg" />
        <button onclick="addProduct()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>Adicionar</button>
      </div>
      <ul id="productList" class="space-y-2"></ul>
    </div>

    <!-- Seção Crédito -->
    <div class="bg-white shadow-xl rounded-2xl p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4"><i data-lucide="wallet" class="inline-block w-5 h-5 mr-2"></i>Crédito</h2>
      <div class="flex gap-2 mb-4">
        <select id="clientSelectCredit" class="flex-1 p-2 border rounded-lg"></select>
        <input id="creditAmountInput" type="number" placeholder="Valor" step="0.01" class="w-24 p-2 border rounded-lg" />
        <button onclick="addCredit()" class="bg-yellow-600 text-white px-4 py-2 rounded-lg hover:bg-yellow-700 transition flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4"></i>Adicionar Crédito</button>
      </div>
      <ul id="creditList" class="space-y-2"></ul>
    </div>

    <!-- Seção Pedidos (Carrinho) -->
    <div class="bg-white shadow-xl rounded-2xl p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4"><i data-lucide="shopping-cart" class="inline-block w-5 h-5 mr-2"></i>Carrinho de Compras</h2>
      <div class="flex gap-2 mb-4">
        <select id="clientSelectOrder" class="flex-1 p-2 border rounded-lg"></select>
        <select id="productSelectOrder" class="flex-1 p-2 border rounded-lg"></select>
        <input id="quantityInput" type="number" placeholder="Qtd" min="1" step="1" value="1" class="w-16 p-2 border rounded-lg" />
        <button onclick="addToOrder()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center gap-2"><i data-lucide="plus-square" class="w-4 h-4"></i>Adicionar ao Pedido</button>
      </div>
      <div id="orderItems" class="mb-4">
        <p class="text-gray-500 italic">Nenhum item no pedido.</p>
      </div>
      <div class="flex justify-between items-center">
        <span id="orderTotal" class="text-lg font-bold text-gray-800">Total: R$ 0,00</span>
        <button onclick="commitOrder()" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition flex items-center gap-2 disabled:opacity-50" id="commitBtn" disabled><i data-lucide="check-circle" class="w-4 h-4"></i>Confirmar Pedido</button>
      </div>
    </div>

    <!-- Seção Histórico de Pedidos -->
    <div class="bg-white shadow-xl rounded-2xl p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4"><i data-lucide="clipboard-list" class="inline-block w-5 h-5 mr-2"></i>Histórico de Pedidos</h2>
      <ul id="orderHistory" class="space-y-2"></ul>
    </div>

    <!-- Seção Config GitHub -->
    <div class="bg-white shadow-xl rounded-2xl p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4"><i data-lucide="github" class="inline-block w-5 h-5 mr-2"></i>Configuração GitHub</h2>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <input id="githubUsername" type="text" placeholder="Usuário" class="p-2 border rounded-lg" />
        <input id="githubRepo" type="text" placeholder="Repositório" class="p-2 border rounded-lg" />
        <input id="githubToken" type="password" placeholder="Token (clássico)" class="p-2 border rounded-lg" />
        <input id="githubBranch" type="text" placeholder="Branch (ex: main)" value="main" class="p-2 border rounded-lg" />
      </div>
      <button onclick="pushToGitHub()" class="bg-gray-800 text-white px-6 py-2 rounded-lg hover:bg-gray-900 transition flex items-center gap-2"><i data-lucide="upload" class="w-4 h-4"></i>Enviar Dados para GitHub</button>
      <p id="githubStatus" class="mt-2 text-sm text-gray-600"></p>
    </div>
  </div>

  <script>
    // ====== DADOS ======
    let clients = [];
    let products = [];
    let credits = []; // { clientName, amount }
    let orders = []; // { clientName, items: [{ productName, quantity, unitPrice }], total, date }
    let currentOrder = []; // { productName, quantity, unitPrice }

    // ====== TOAST ======
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50 transition-opacity duration-300 ' + (isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white');
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 3000);
    }

    // ====== CLIENTES ======
    function addClient() {
      const name = document.getElementById('clientNameInput').value.trim();
      if (!name) {
        showToast('Nome do cliente é obrigatório.', true);
        return;
      }
      if (clients.includes(name)) {
        showToast('Cliente já existe.', true);
        return;
      }
      clients.push(name);
      document.getElementById('clientNameInput').value = '';
      showToast('Cliente adicionado: ' + name);
      renderClients();
      updateSelects();
    }

    function renderClients() {
      const ul = document.getElementById('clientList');
      ul.innerHTML = clients.map(client => '<li class="flex justify-between items-center p-2 bg-gray-50 rounded"><span>' + escapeHTML(client) + '</span><button onclick="deleteClient(\'' + escapeHTML(client) + '\')" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button></li>').join('');
      lucide.createIcons();
    }

    function deleteClient(name) {
      clients = clients.filter(c => c !== name);
      credits = credits.filter(c => c.clientName !== name);
      currentOrder = [];
      renderClients();
      updateSelects();
      showToast('Cliente removido: ' + name);
    }

    // ====== PRODUTOS ======
    function addProduct() {
      const name = document.getElementById('productNameInput').value.trim();
      const price = parseFloat(document.getElementById('productPriceInput').value);
      if (!name) {
        showToast('Nome do produto é obrigatório.', true);
        return;
      }
      if (isNaN(price) || price < 0) {
        showToast('Preço deve ser um número não negativo.', true);
        return;
      }
      if (products.some(p => p.name === name)) {
        showToast('Produto já existe.', true);
        return;
      }
      products.push({ name, price });
      document.getElementById('productNameInput').value = '';
      document.getElementById('productPriceInput').value = '';
      showToast('Produto adicionado: ' + name + ' - R$ ' + price.toFixed(2));
      renderProducts();
      updateSelects();
    }

    function renderProducts() {
      const ul = document.getElementById('productList');
      ul.innerHTML = products.map(p => '<li class="flex justify-between items-center p-2 bg-gray-50 rounded"><span>' + escapeHTML(p.name) + ' - R$ ' + p.price.toFixed(2) + '</span><button onclick="deleteProduct(\'' + escapeHTML(p.name) + '\')" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button></li>').join('');
      lucide.createIcons();
    }

    function deleteProduct(name) {
      products = products.filter(p => p.name !== name);
      currentOrder = currentOrder.filter(item => item.productName !== name);
      renderProducts();
      updateSelects();
      showToast('Produto removido: ' + name);
    }

    // ====== CRÉDITO ======
    function addCredit() {
      const clientSelect = document.getElementById('clientSelectCredit');
      const clientName = clientSelect.value;
      if (!clientName) {
        showToast('Selecione um cliente.', true);
        return;
      }
      const amount = parseFloat(document.getElementById('creditAmountInput').value);
      if (isNaN(amount) || amount <= 0) {
        showToast('Valor deve ser positivo.', true);
        return;
      }
      const existing = credits.find(c => c.clientName === clientName);
      if (existing) {
        existing.amount += amount;
      } else {
        credits.push({ clientName, amount });
      }
      document.getElementById('creditAmountInput').value = '';
      showToast('Crédito adicionado: R$ ' + amount.toFixed(2) + ' para ' + clientName);
      renderCredits();
    }

    function renderCredits() {
      const ul = document.getElementById('creditList');
      ul.innerHTML = credits.map(c => '<li class="flex justify-between items-center p-2 bg-gray-50 rounded"><span>' + escapeHTML(c.clientName) + ': R$ ' + c.amount.toFixed(2) + '</span><button onclick="deleteCredit(\'' + escapeHTML(c.clientName) + '\')" class="text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button></li>').join('');
      lucide.createIcons();
    }

    function deleteCredit(clientName) {
      credits = credits.filter(c => c.clientName !== clientName);
      renderCredits();
      showToast('Crédito removido para: ' + clientName);
    }

    // ====== PEDIDOS (CARRINHO) ======
    function updateSelects() {
      const clientSelects = ['clientSelectCredit', 'clientSelectOrder'];
      clientSelects.forEach(id => {
        const select = document.getElementById(id);
        select.innerHTML = '<option value="">Selecione um cliente</option>' + clients.map(c => '<option value="' + escapeHTML(c) + '">' + escapeHTML(c) + '</option>').join('');
      });

      const productSelect = document.getElementById('productSelectOrder');
      productSelect.innerHTML = '<option value="">Selecione um produto</option>' + products.map(p => '<option value="' + escapeHTML(p.name) + '">' + escapeHTML(p.name) + ' - R$ ' + p.price.toFixed(2) + '</option>').join('');
    }

    function addToOrder() {
      const clientName = document.getElementById('clientSelectOrder').value;
      const productName = document.getElementById('productSelectOrder').value;
      const quantity = parseInt(document.getElementById('quantityInput').value);

      if (!clientName) {
        showToast('Selecione um cliente.', true);
        return;
      }
      if (!productName) {
        showToast('Selecione um produto.', true);
        return;
      }
      if (isNaN(quantity) || quantity < 1) {
        showToast('Quantidade deve ser um número inteiro positivo.', true);
        return;
      }

      const product = products.find(p => p.name === productName);
      if (!product) {
        showToast('Produto não encontrado.', true);
        return;
      }

      // Adicionar ou atualizar quantidade no carrinho
      const existing = currentOrder.find(item => item.productName === productName);
      if (existing) {
        existing.quantity += quantity;
      } else {
        currentOrder.push({ productName, quantity, unitPrice: product.price });
      }

      document.getElementById('quantityInput').value = 1;
      showToast('Item adicionado ao carrinho.');
      renderOrder();
    }

    function removeFromOrder(productName) {
      currentOrder = currentOrder.filter(item => item.productName !== productName);
      renderOrder();
      showToast('Item removido do carrinho.');
    }

    function renderOrder() {
      const container = document.getElementById('orderItems');
      const totalSpan = document.getElementById('orderTotal');
      const commitBtn = document.getElementById('commitBtn');

      if (currentOrder.length === 0) {
        container.innerHTML = '<p class="text-gray-500 italic">Nenhum item no pedido.</p>';
        totalSpan.textContent = 'Total: R$ 0,00';
        commitBtn.disabled = true;
        return;
      }

      let total = 0;
      let html = '<ul class="space-y-2">';
      currentOrder.forEach(item => {
        const subtotal = item.quantity * item.unitPrice;
        total += subtotal;
        html += '<li class="flex justify-between items-center p-2 bg-gray-50 rounded">' +
          '<span>' + escapeHTML(item.productName) + ' x' + item.quantity + ' - R$ ' + item.unitPrice.toFixed(2) + ' = R$ ' + subtotal.toFixed(2) + '</span>' +
          '<button onclick="removeFromOrder(\'' + escapeHTML(item.productName) + '\')" class="text-red-500 hover:text-red-700"><i data-lucide="x-circle" class="w-4 h-4"></i></button>' +
        '</li>';
      });
      html += '</ul>';
      container.innerHTML = html;
      totalSpan.textContent = 'Total: R$ ' + total.toFixed(2);
      commitBtn.disabled = false;
      lucide.createIcons();
    }

    function commitOrder() {
      const clientName = document.getElementById('clientSelectOrder').value;
      if (!clientName) {
        showToast('Selecione um cliente.', true);
        return;
      }
      if (currentOrder.length === 0) {
        showToast('Carrinho vazio.', true);
        return;
      }

      const total = currentOrder.reduce((sum, item) => sum + item.quantity * item.unitPrice, 0);

      // Registrar pedido
      const order = {
        clientName,
        items: currentOrder.map(item => ({ ...item })),
        total,
        date: new Date().toLocaleString('pt-BR')
      };
      orders.push(order);

      // Debitar do crédito (permitindo negativo)
      const credit = credits.find(c => c.clientName === clientName);
      if (credit) {
        credit.amount -= total;
      } else {
        credits.push({ clientName, amount: -total });
      }

      // Limpar carrinho
      currentOrder = [];
      renderOrder();
      renderCredits();
      renderOrderHistory();
      showToast('Pedido confirmado! Débito de R$ ' + total.toFixed(2) + ' para ' + clientName);
    }

    function renderOrderHistory() {
      const ul = document.getElementById('orderHistory');
      if (orders.length === 0) {
        ul.innerHTML = '<p class="text-gray-500 italic">Nenhum pedido realizado.</p>';
        return;
      }
      ul.innerHTML = orders.map((order, index) => {
        const itemsHtml = order.items.map(item => escapeHTML(item.productName) + ' x' + item.quantity + ' (R$ ' + item.unitPrice.toFixed(2) + ')').join(', ');
        return '<li class="p-2 bg-gray-50 rounded"><strong>#' + (index+1) + '</strong> ' + escapeHTML(order.clientName) + ' - Total: R$ ' + order.total.toFixed(2) + '<br><small>' + itemsHtml + ' - ' + order.date + '</small></li>';
      }).join('');
    }

    // ====== GITHUB ======
    function pushToGitHub() {
      const username = document.getElementById('githubUsername').value.trim();
      const repo = document.getElementById('githubRepo').value.trim();
      const token = document.getElementById('githubToken').value.trim();
      const branch = document.getElementById('githubBranch').value.trim() || 'main';

      if (!username || !repo || !token) {
        showToast('Preencha todos os campos do GitHub.', true);
        return;
      }

      const data = {
        clients,
        products,
        credits,
        orders
      };
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

      const url = `https://api.github.com/repos/${username}/${repo}/contents/dados.json`;

      fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': 'token ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Atualização dos dados do sistema',
          content: content,
          branch: branch
        })
      })
      .then(response => {
        if (!response.ok) {
          return response.json().then(err => { throw new Error(err.message); });
        }
        return response.json();
      })
      .then(() => {
        showToast('Dados enviados ao GitHub com sucesso!');
        document.getElementById('githubStatus').textContent = 'Último envio: ' + new Date().toLocaleString('pt-BR');
      })
      .catch(error => {
        showToast('Erro ao enviar para GitHub: ' + error.message, true);
        document.getElementById('githubStatus').textContent = 'Erro: ' + error.message;
      });
    }

    // ====== UTILITÁRIOS ======
    function escapeHTML(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // ====== INICIALIZAÇÃO ======
    updateSelects();
    renderOrder();
    renderOrderHistory();
    lucide.createIcons();
  </script>
</body>
</html>
