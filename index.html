<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caderninho Digital Pro - Cloud</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between antialiased pb-20 select-none">

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3.5 sticky top-0 z-40 shadow-md">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex items-center gap-2">
                <div class="bg-amber-500/10 p-2 rounded-xl text-amber-500">
                    <i data-lucide="cloud-lightning" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 id="view-title" class="font-black text-base tracking-tight text-amber-500 uppercase">Apontar Consumo</h1>
                    <p id="cloud-status" class="text-[9px] text-rose-400 font-bold tracking-wide">NUVEM DESCONECTADA</p>
                </div>
            </div>
            <button onclick="switchTab('config', 'Configurar GitHub', this)" class="bg-slate-800 text-slate-400 p-2 rounded-xl border border-slate-700/60 active:scale-90 transition-all">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- CONTAINER DAS TELAS -->
    <main class="flex-1 max-w-md w-full mx-auto px-4 py-4 overflow-y-auto">

        <!-- TELA 1: CONSUMO -->
        <div id="view-consumption" class="space-y-3 view-tab">
            <input id="search-consumption-client" type="text" oninput="renderConsumptionView()" placeholder="🔎 Buscar cliente pelo nome..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
            <div id="consumption-list" class="space-y-2"></div>
        </div>

        <!-- TELA 2: CRÉDITO -->
        <div id="view-credit" class="space-y-3 view-tab hidden">
            <div id="credit-list" class="space-y-2"></div>
        </div>

        <!-- TELA 3: CLIENTES -->
        <div id="view-clients" class="space-y-4 view-tab hidden">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3 shadow-md">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Cadastrar Novo Cliente</h3>
                <input id="input-client-name" type="text" placeholder="Nome do Cliente" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
                <button onclick="addClient()" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl flex items-center justify-center gap-2 text-sm shadow-md active:scale-95 transition-all">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> CADASTRAR CLIENTE
                </button>
            </div>
            <div id="clients-registry-list" class="space-y-2"></div>
        </div>

        <!-- TELA 4: PRODUTOS -->
        <div id="view-products" class="space-y-4 view-tab hidden">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3 shadow-md">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Cadastrar Novo Produto</h3>
                <input id="input-product-name" type="text" placeholder="Nome do Produto" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
                <input id="input-product-price" type="number" step="0.01" placeholder="Preço R\$" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
                <button onclick="addProduct()" class="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl flex items-center justify-center gap-2 text-sm shadow-md active:scale-95 transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i> CADASTRAR PRODUTO
                </button>
            </div>
            <div id="products-registry-list" class="space-y-2 max-h-60 overflow-y-auto no-scrollbar"></div>
        </div>

        <!-- TELA 5: CONFIGURAÇÃO DO GITHUB -->
        <div id="view-config" class="space-y-4 view-tab hidden">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3 shadow-md">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1"><i data-lucide="github" class="w-4 h-4"></i> Credenciais do Banco Cloud</h3>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Usuário do GitHub</label>
                    <input id="cfg-user" type="text" placeholder="Seu nome de usuário" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Nome do Repositório</label>
                    <input id="cfg-repo" type="text" placeholder="caderninho" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Personal Access Token (PAT)</label>
                    <input id="cfg-token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500 font-mono">
                </div>
                <button onclick="saveConfig()" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl flex items-center justify-center gap-2 text-sm shadow-md active:scale-95 transition-all">
                    <i data-lucide="cloud-lightning" class="w-4 h-4"></i> CONECTAR E CONVERTER
                </button>
            </div>
        </div>

    </main>

    <!-- MODAL DE SELEÇÃO DE PRODUTO -->
    <div id="modal-billing" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-end justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-start">
                <div>
                    <h3 id="billing-client-name" class="font-black text-slate-100 text-lg">Cliente</h3>
                    <p class="text-xs text-slate-400">Saldo Atual: <span id="billing-client-balance" class="text-emerald-400 font-mono font-bold">R\$ 0,00</span></p>
                </div>
                <button onclick="closeBillingModal()" class="text-slate-400 bg-slate-950 p-2 rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="billing-products-grid" class="flex-1 overflow-y-auto space-y-2 no-scrollbar pr-1"></div>
        </div>
    </div>

    <!-- UI ALERTA -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-rose-600 border border-rose-500 text-white font-extrabold px-6 py-3.5 rounded-xl shadow-2xl text-center text-xs tracking-wide opacity-0 transition-opacity duration-300 pointer-events-none z-50 uppercase">
        ⚠️ Saldo Insuficiente!
    </div>

    <!-- BARRA DE ABAS INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 py-2 px-3 z-40 shadow-2xl">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1.5">
            <button onclick="switchTab('consumption', 'Apontar Consumo', this)" class="nav-tab-btn flex flex-col items-center gap-1 py-2 rounded-xl text-amber-500 bg-amber-500/10 font-bold">
                <i data-lucide="utensils-crossed" class="w-5 h-5"></i><span class="text-[10px]">Consumo</span>
            </button>
            <button onclick="switchTab('credit', 'Adicionar Crédito', this)" class="nav-tab-btn flex flex-col items-center gap-1 py-2 rounded-xl text-slate-400 hover:text-slate-200">
                <i data-lucide="circle-dollar-sign" class="w-5 h-5"></i><span class="text-[10px]">+ Crédito</span>
            </button>
            <button onclick="switchTab('clients', 'Gerenciar Clientes', this)" class="nav-tab-btn flex flex-col items-center gap-1 py-2 rounded-xl text-slate-400 hover:text-slate-200">
                <i data-lucide="users" class="w-5 h-5"></i><span class="text-[10px]">Clientes</span>
            </button>
            <button onclick="switchTab('products', 'Catálogo de Produtos', this)" class="nav-tab-btn flex flex-col items-center gap-1 py-2 rounded-xl text-slate-400 hover:text-slate-200">
                <i data-lucide="package" class="w-5 h-5"></i><span class="text-[10px]">Produtos</span>
            </button>
        </div>
    </nav>

    <!-- LÓGICA E CONEXÃO COM A API DO GITHUB -->
    <script>
        lucide.createIcons();

        // Variáveis de Banco e Arquivo Hash do GitHub (Necessário para dar Update via API)
        let DATABASE = { clients: [], products: [] };
        let fileSha = null; 

        // Resgata configurações salvas no dispositivo do vendedor
        let GITHUB_CONFIG = JSON.parse(localStorage.getItem('GH_CONFIG')) || { user: '', repo: '', token: '' };

        // Inicializa preenchendo a tela de configuração
        document.getElementById('cfg-user').value = GITHUB_CONFIG.user;
