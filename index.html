    <!-- CORE TRANSACTION SYSTEM ENGINE -->
    <script>
        lucide.createIcons();

        let DATABASE = { clients: [], products: [] };
        let fileSha = null; 
        let activeClientId = null;
        let activeTabId = 'consumption';

        let GITHUB_CONFIG = JSON.parse(localStorage.getItem('GH_CONFIG')) || { user: '', repo: '', token: '' };

        document.getElementById('cfg-user').value = GITHUB_CONFIG.user;
        document.getElementById('cfg-repo').value = GITHUB_CONFIG.repo;
        document.getElementById('cfg-token').value = GITHUB_CONFIG.token;

        function logDebug(msg) {
            const el = document.getElementById('terminal-debug');
            el.innerHTML += "<div>[" + new Date().toLocaleTimeString() + "]: " + msg + "</div>";
            el.scrollTop = el.scrollHeight;
        }

        function utf8_to_b64(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode(parseInt(p1, 16));
            }));
        }

        function b64_to_utf8(str) {
            return decodeURIComponent(atob(str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }

        function saveConfig() {
            GITHUB_CONFIG.user = document.getElementById('cfg-user').value.trim();
            GITHUB_CONFIG.repo = document.getElementById('cfg-repo').value.trim();
            GITHUB_CONFIG.token = document.getElementById('cfg-token').value.trim();
            localStorage.setItem('GH_CONFIG', JSON.stringify(GITHUB_CONFIG));
            logDebug("Configurações salvas locais. Tentando parear...");
            fetchFromGitHub();
        }

        async function fetchFromGitHub() {
            if (!GITHUB_CONFIG.token || !GITHUB_CONFIG.user || !GITHUB_CONFIG.repo) {
                logDebug("Aviso: Faltam parâmetros de credenciais Git.");
                return;
            }
            
            const statusEl = document.getElementById('cloud-status');
            statusEl.innerText = "🔌 SINCRONIZANDO...";
            statusEl.className = "text-[9px] text-amber-400 font-bold tracking-wide uppercase";

            const url = "https://github.com" + GITHUB_CONFIG.user + "/" + GITHUB_CONFIG.repo + "/contents/dados.json";
            
            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': "token " + GITHUB_CONFIG.token, 'Cache-Control': 'no-cache' }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    fileSha = data.sha;
                    DATABASE = JSON.parse(b64_to_utf8(data.content));
                    
                    statusEl.innerText = "☁️ BANCO CONECTADO";
                    statusEl.className = "text-[9px] text-emerald-400 font-bold tracking-wide uppercase";
                    logDebug("Sucesso: Dados em Nuvem sincronizados!");
                    refreshActiveView();
                } else {
                    const errRes = await response.json();
                    logDebug("Erro Git " + response.status + ": " + errRes.message);
                    statusEl.innerText = "⚠️ ERRO DE LOGIN";
                    statusEl.className = "text-[9px] text-rose-500 font-bold tracking-wide uppercase";
                }
            } catch (err) {
                logDebug("Falha: Erro de rede ou CORS.");
                statusEl.innerText = "⚠️ SEM INTERNET";
                statusEl.className = "text-[9px] text-rose-500 font-bold tracking-wide uppercase";
            }
        }

        async function pushToGitHub() {
            if (!GITHUB_CONFIG.token) return;

            const statusEl = document.getElementById('cloud-status');
            statusEl.innerText = "⏳ GRAVANDO...";
            statusEl.className = "text-[9px] text-amber-400 font-bold tracking-wide uppercase";

            const url = "https://github.com" + GITHUB_CONFIG.user + "/" + GITHUB_CONFIG.repo + "/contents/dados.json";
            const jsonString = JSON.stringify(DATABASE, null, 2);
            const base64Content = utf8_to_b64(jsonString);

            const body = {
                message: "📱 Transação realizada via Mobile Client Dashboard",
                content: base64Content,
                sha: fileSha
            };

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': "token " + GITHUB_CONFIG.token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (response.ok) {
                    const data = await response.json();
                    fileSha = data.content.sha;
                    statusEl.innerText = "☁️ BANCO CONECTADO";
                    statusEl.className = "text-[9px] text-emerald-400 font-bold tracking-wide uppercase";
                    logDebug("Sucesso: Transação salva na nuvem!");
                } else {
                    const errRes = await response.json();
                    logDebug("Erro de Escrita " + response.status + ": " + errRes.message);
                    if(response.status === 409) { logDebug("Conflito de SHA! Forçando re-sincronização..."); fetchFromGitHub(); }
                }
            } catch (err) {
                logDebug("Falha: Não foi possível enviar transação.");
            }
        }

        function switchTab(tabId, title, btnElement) {
            activeTabId = tabId;
            document.querySelectorAll('.view-tab').forEach(el => el.classList.add('hidden'));
            document.getElementById("view-" + tabId).classList.remove('hidden');
            document.getElementById('view-title').innerText = title;

            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                btn.className = "nav-tab-btn flex flex-col items-center gap-1 py-2 rounded-xl text-slate-400 hover:text-slate-200 transition-all";
            });
            if(btnElement.classList.contains('nav-tab-btn')) {
                btnElement.className = "nav-tab-btn flex flex-col items-center gap-1 py-2 rounded-xl text-amber-500 bg-amber-500/10 font-bold transition-all";
            }
            refreshActiveView();
        }

        function refreshActiveView() {
            if (activeTabId === 'consumption') renderConsumptionView();
            if (activeTabId === 'credit') renderCreditView();
            if (activeTabId === 'clients') renderClientsView();
            if (activeTabId === 'products') renderProductsView();
        }

        function renderConsumptionView() {
            const query = document.getElementById('search-consumption-client').value.toLowerCase();
            const container = document.getElementById('consumption-list');
            const filtered = DATABASE.clients.filter(c => c.name.toLowerCase().includes(query));
            
            if(filtered.length === 0) { container.innerHTML = '<p class="text-xs text-slate-600 text-center py-6">Nenhum cliente ativo.</p>'; return; }

            container.innerHTML = filtered.map(c => {
                const isZero = c.balance <= 0;
                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center shadow-sm">
                        <div onclick="${isZero ? '' : 'openBillingModal(\'' + c.id + '\')'}" class="flex-1 cursor-pointer">
                            <h4 class="font-extrabold text-sm ${isZero ? 'text-slate-500 line-through' : 'text-slate-100'}">${c.name}</h4>
                            <p class="text-xs font-mono font-black mt-1 ${isZero ? 'text-rose-500 bg-rose-500/10 border border-rose-500/20 px-2 py-0.5 rounded w-max text-[10px]' : 'text-emerald-400'}">
                                ${isZero ? 'SALDO ZERADO' : 'Disponível: R$ ' + c.balance.toFixed(2).replace('.', ',')}
                            </p>
                        </div>
                        ${!isZero ? '<button onclick="openBillingModal(\'' + c.id + '\')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs px-4 py-3 rounded-xl flex items-center gap-1 transition-all"><i data-lucide="utensils-crossed" class="w-3.5 h-3.5"></i> DEBITAR</button>' : ''}
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function openBillingModal(id) {
            activeClientId = id;
            const client = DATABASE.clients.find(c => c.id == id);
            document.getElementById('billing-client-name').innerText = client.name;
            document.getElementById('billing-client-balance').innerText = "R\$ " + client.balance.toFixed(2).replace('.', ',');
            
            const container = document.getElementById('billing-products-grid');
            if(DATABASE.products.length === 0){ container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Nenhum produto cadastrado.</p>'; }
            else {
                container.innerHTML = DATABASE.products.map(p => `
                    <button onclick="executeDebit(${p.price}, '${p.name}')" class="w-full bg-slate-950 border border-slate-800 hover:border-amber-500 p-4 rounded-xl flex justify-between items-center text-left transition-colors">
                        <span class="font-extrabold text-slate-200 text-xs">${p.name}</span>
                        <span class="text-amber-400 font-mono font-black text-xs">R$ ${p.price.toFixed(2).replace('.', ',')}</span>
                    </button>
                `).join('');
            }
            document.getElementById('modal-billing').classList.remove('hidden');
        }

function closeBillingModal() { 
    document.getElementById('modal-billing').classList.add('hidden'); 
    activeClientId = null; 
}

function executeDebit(price, name) {
    var client = DATABASE.clients.find(function(c) { return c.id == activeClientId; });
    if (client.balance >= price) {
        client.balance -= price;
        document.getElementById('billing-client-balance').innerText = "R$ " + client.balance.toFixed(2).replace('.', ',');
        renderConsumptionView();
        pushToGitHub();
        if (client.balance <= 0) closeBillingModal();
    } else {
        triggerToast();
    }
}

function renderCreditView() {
    var container = document.getElementById('credit-list');
    if(DATABASE.clients.length === 0) { 
        container.innerHTML = 'Nenhum cliente cadastrado.'; 
        return; 
    }
    container.innerHTML = DATABASE.clients.map(function(c) {
        return '<div onclick="triggerAddCreditFlow(\'' + c.id + '\')" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center cursor-pointer hover:border-slate-700 transition-all">' +
               '  <div><h4 class="font-bold text-slate-200 text-sm">' + c.name + '</h4><p class="text-xs font-mono text-slate-400">Saldo: R$ ' + c.balance.toFixed(2).replace('.', ',') + '</p></div>' +
               '  <button class="bg-emerald-600 text-white font-black text-xs px-4 py-3 rounded-xl"><i data-lucide="plus" class="w-3.5 h-3.5"></i> ADICIONAR</button>' +
               '</div>';
    }).join('');
    lucide.createIcons();
}

function triggerAddCreditFlow(id) {
    var client = DATABASE.clients.find(function(c) { return c.id == id; });
    var value = parseFloat(prompt("Quanto de crédito R$ para colocar na conta de: " + client.name + "?"));
    if (isNaN(value) || value <= 0) return;
    client.balance += value;
    renderCreditView();
    pushToGitHub();
}

function addClient() {
    var input = document.getElementById('input-client-name');
    var val = input.value.trim();
    if (!val) return;
    DATABASE.clients.push({ id: Date.now().toString(), name: val, balance: 0.00 });
    input.value = '';
    renderClientsView();
    pushToGitHub();
}

function renderClientsView() {
    var container = document.getElementById('clients-registry-list');
    if(DATABASE.clients.length === 0) {
        container.innerHTML = 'Nenhum cliente cadastrado.';
        return;
    }
    container.innerHTML = DATABASE.clients.map(function(c) {
        return '<div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center text-sm border border-slate-800">' +
               '  <span class="font-bold text-slate-300">' + c.name + '</span>' +
               '  <button onclick="deleteClient(\'' + c.id + '\')" class="text-rose-400 p-1 hover:bg-rose-500/10 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>' +
               '</div>';
    }).join('');
    lucide.createIcons();
}

function deleteClient(id) {
    if(confirm("Remover este cliente permanentemente?")) {
        DATABASE.clients = DATABASE.clients.filter(function(c) { return c.id != id; });
        renderClientsView();
        pushToGitHub();
    }
}

function addProduct() {
    var nameInput = document.getElementById('input-product-name');
    var priceInput = document.getElementById('input-product-price');
    var price = parseFloat(priceInput.value);
    var name = nameInput.value.trim();
    if (!name || isNaN(price)) return;
    DATABASE.products.push({ id: Date.now().toString(), name: name, price: price });
    nameInput.value = ''; priceInput.value = '';
    renderProductsView();
    pushToGitHub();
}

function renderProductsView() {
    var container = document.getElementById('products-registry-list');
    if(DATABASE.products.length === 0) {
        container.innerHTML = 'Nenhum produto cadastrado.';
        return;
    }
    container.innerHTML = DATABASE.products.map(function(p) {
        return '<div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center text-sm border border-slate-800">' +
               '  <span class="font-medium text-slate-300">' + p.name + '</span>' +
               '  <div class="flex items-center gap-3">' +
               '    <span class="text-amber-400 font-mono font-bold">R$ ' + p.price.toFixed(2).replace('.', ',') + '</span>' +
               '    <button onclick="deleteProduct(\'' + p.id + '\')" class="text-rose-400 p-1 hover:bg-rose-500/10 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>' +
               '  </div>' +
               '</div>';
    }).join('');
    lucide.createIcons();
}

function deleteProduct(id) {
    if(confirm("Excluir este produto do catálogo?")) {
        DATABASE.products = DATABASE.products.filter(function(p) { return p.id != id; });
        renderProductsView();
        pushToGitHub();
    }
}

function triggerToast() {
    var toast = document.getElementById('toast');
    toast.style.opacity = "1";
    setTimeout(function() { toast.style.opacity = "0"; }, 2500);
}

fetchFromGitHub();
